<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatLeft {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes floatRight {
        0% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.25; }
        50% { opacity: 0.65; }
        100% { opacity: 0.25; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .floating-card-1 {
        animation: floatLeft 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatRight 7s ease-in-out infinite;
      }
      .pulsing-orb {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .cursor-blink {
        animation: blinkCursor 1s infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Matrix/Grid Lines in Background -->
  <g opacity="0.15">
    <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250 M0,300 L1200,300 M0,350 L1200,350" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4,6"/>
    <path d="M100,0 L100,400 M200,0 L200,400 M300,0 L300,400 M400,0 L400,400 M500,0 L500,400 M600,0 L600,400 M700,0 L700,400 M800,0 L800,400 M900,0 L900,400 M1000,0 L1000,400 M1100,0 L1100,400" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="4,6"/>
  </g>

  <!-- Ambient Light Orbs (Background Glows) -->
  <circle cx="200" cy="120" r="160" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulsing-orb"/>
  <circle cx="1000" cy="280" r="180" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="pulsing-orb"/>
  <circle cx="600" cy="200" r="220" fill="#6366f1" opacity="0.1" filter="url(#glow)"/>

  <!-- Dynamic / Floating Background Decorative Cards -->
  <!-- Left Decorative Terminal Pane -->
  <g class="floating-card-1" opacity="0.55">
    <rect x="40" y="60" width="250" height="160" rx="10" fill="url(#glassCard)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="60" cy="78" r="4" fill="#ef4444"/>
    <circle cx="75" cy="78" r="4" fill="#f59e0b"/>
    <circle cx="90" cy="78" r="4" fill="#10b981"/>
    <text x="60" y="110" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#38bdf8">$ zellij --layout bsp</text>
    <text x="60" y="132" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#64748b">✓ pane: agent-inbox [active]</text>
    <text x="60" y="154" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#64748b">✓ gpu_render: metal/gl 120fps</text>
    <text x="60" y="176" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#10b981">✓ tui_session: attached</text>
  </g>

  <!-- Right Decorative TUI Visualizer Pane -->
  <g class="floating-card-2" opacity="0.55">
    <rect x="910" y="180" width="250" height="160" rx="10" fill="url(#glassCard)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="930" cy="198" r="4" fill="#ef4444"/>
    <circle cx="945" cy="198" r="4" fill="#f59e0b"/>
    <circle cx="960" cy="198" r="4" fill="#10b981"/>
    <text x="930" y="230" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#c084fc">CPU [||||||||||||    ] 64%</text>
    <text x="930" y="252" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#38bdf8">RAM [||||||||||||||||] 82%</text>
    <text x="930" y="274" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#10b981">TTY : pts/4 (tmux-sync)</text>
    <text x="930" y="296" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#f59e0b">IPC : daemon socket alive</text>
  </g>

  <!-- Foreground Main Window Shell -->
  <g>
    <!-- Central Backing Container -->
    <rect x="180" y="45" width="840" height="310" rx="14" fill="#070b14" fill-opacity="0.92" stroke="url(#cyanPurpleGrad)" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Window Title Bar -->
    <rect x="180" y="45" width="840" height="42" rx="14" fill="#111827" fill-opacity="0.95"/>
    <rect x="180" y="72" width="840" height="15" fill="#111827"/>
    <line x1="180" y1="87" x2="1020" y2="87" stroke="#1f2937" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="210" cy="66" r="6" fill="#ef4444"/>
    <circle cx="230" cy="66" r="6" fill="#f59e0b"/>
    <circle cx="250" cy="66" r="6" fill="#10b981"/>

    <!-- Center Window Tab Title -->
    <text x="600" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">⚡ tui-os :: session: main [awesome-terminal]</text>

    <!-- Main Title in Foreground -->
    <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="32" font-weight="800" fill="url(#cyanPurpleGrad)" letter-spacing="-0.5">
      Awesome Terminal OS &amp; TUI Utilities
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
      Terminal Window Managers • GPU Multiplexers • Modern Emulators • TUI Frameworks
    </text>

    <!-- Terminal Command Line Prompt -->
    <g transform="translate(320, 225)">
      <rect x="0" y="0" width="560" height="36" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="23" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#22c55e">dev@terminal-os</text>
      <text x="145" y="23" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#94a3b8">:~$</text>
      <text x="175" y="23" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#f8fafc">tui-os-env --status --benchmarks</text>
      <rect x="445" y="11" width="8" height="15" fill="#38bdf8" class="cursor-blink"/>
    </g>

    <!-- Tech Badges / Pills Row -->
    <g transform="translate(250, 285)">
      <!-- Pill 1: GPU Accelerated -->
      <rect x="0" y="0" width="155" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="77" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🚀 GPU Accelerated</text>

      <!-- Pill 2: Modal Tiling -->
      <rect x="170" y="0" width="155" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="247" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">🪟 Modal Tiling &amp; BSP</text>

      <!-- Pill 3: Agent Orchestration -->
      <rect x="340" y="0" width="175" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
      <text x="427" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#d8b4fe">🤖 Agent-Aware Panes</text>

      <!-- Pill 4: Open Source -->
      <rect x="530" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <text x="615" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#34d399">⭐ Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>